version: '3.8'

services:
  postgresdb:
    image: postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=${POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${POSTGRESDB_ROOT_PASSWORD}
      - POSTGRES_DB=${POSTGRESDB_DATABASE}
    ports:
      - "${POSTGRESDB_LOCAL_PORT}:${POSTGRESDB_DOCKER_PORT}"
    volumes:
      - db:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESDB_USER} -d ${POSTGRESDB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  app:
    depends_on:
      postgresdb:
        condition: service_healthy
    build: ./trade-app
    restart: unless-stopped
    env_file: ./trade-app/.env
    ports:
      - "${NODE_LOCAL_PORT:-3000}:${NODE_DOCKER_PORT:-3000}"
    environment:
      - DB_HOST=postgresdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bezkoder_db
      - DB_PORT=5432
    stdin_open: true
    tty: true

volumes:
  db: